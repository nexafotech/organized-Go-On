name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      export_method:
        description: 'Export method (development, ad-hoc, app-store)'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - ad-hoc
          - app-store
  push:
    branches: [ main, master, fix/ios-ipa-signing ]
    tags: [ 'v*' ]

jobs:
  build-ios:
    name: Build & Package iOS IPA
    runs-on: macos-15
    permissions:
      contents: write
    env:
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Xcode Environment
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          sudo xcodebuild -runFirstLaunch
          xcodebuild -version
          xcodebuild -showsdks
          xcrun simctl list runtimes

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      - name: Prepare Flutter and CocoaPods Dependencies
        working-directory: mobile
        run: |
          flutter config --no-enable-swift-package-manager
          flutter precache --ios
          flutter pub get
          cd ios
          pod install
          cd ..
          xcodebuild -showdestinations -scheme Runner -project ios/Runner.xcodeproj

      # Step A: Install Apple Certificate and Provisioning Profile if secrets are provided
      - name: Install Apple Certificate and Provisioning Profile
        if: ${{ env.BUILD_CERTIFICATE_BASE64 != '' }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

          echo "Apple Signing Certificate and Provisioning Profile installed successfully!"

      # Step B1: Build Signed iOS IPA if Certificate is present
      - name: Build Signed iOS IPA
        if: ${{ env.BUILD_CERTIFICATE_BASE64 != '' }}
        working-directory: mobile
        run: |
          METHOD="${{ github.event.inputs.export_method || 'development' }}"
          PLIST="ios/ExportOptions-${METHOD^}.plist"
          if [ ! -f "$PLIST" ]; then
            PLIST="ios/ExportOptions.plist"
          fi
          echo "Building with ExportOptions: $PLIST"
          flutter build ipa --release --export-options-plist="$PLIST" -v

          mkdir -p ../dist_output
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -n 1)
          cp "$IPA_PATH" ../dist_output/go-on-v2.2.2.ipa
          cp "$IPA_PATH" ../dist_output/go-on-latest.ipa

          echo "Verifying Signed IPA..."
          mkdir -p /tmp/ipa-verify
          unzip -q "$IPA_PATH" -d /tmp/ipa-verify
          codesign --verify --deep --strict --verbose=2 /tmp/ipa-verify/Payload/Runner.app || true
          codesign -dv --verbose=4 /tmp/ipa-verify/Payload/Runner.app || true
          rm -rf /tmp/ipa-verify

      # Step B2: Build Clean Sideloadly-Ready IPA (Fallback when cloud certificate is absent)
      - name: Build Clean Sideloadly-Ready IPA
        if: ${{ env.BUILD_CERTIFICATE_BASE64 == '' }}
        working-directory: mobile
        run: |
          echo "Apple Developer cloud secrets not configured. Building clean release binary for local Sideloadly / AltStore signing..."
          flutter build ios --release --no-codesign -v

          echo "Packaging into Payload directory..."
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/

          echo "Applying clean ad-hoc codesign structure across frameworks and main bundle..."
          find Payload/Runner.app/Frameworks -type d -name "*.framework" -exec codesign --force --sign - --timestamp=none {} \; 2>/dev/null || true
          codesign --force --deep --sign - --timestamp=none Payload/Runner.app 2>/dev/null || true

          mkdir -p ../dist_output
          echo "Creating IPA archive preserving symlinks..."
          zip -qry ../dist_output/go-on-v2.2.2.ipa Payload
          cp ../dist_output/go-on-v2.2.2.ipa ../dist_output/go-on-latest.ipa
          rm -rf Payload
          echo "Packaging complete!"

      # Step C: Inspect and Verify Package Structure
      - name: Verify IPA Package Structure
        run: |
          echo "Inspecting produced IPA archive..."
          mkdir -p /tmp/verify-ipa
          unzip -q dist_output/go-on-latest.ipa -d /tmp/verify-ipa
          echo "### Package Inspection Summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -lh /tmp/verify-ipa/Payload/Runner.app >> $GITHUB_STEP_SUMMARY
          file /tmp/verify-ipa/Payload/Runner.app/Runner >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          codesign -dv --verbose=4 /tmp/verify-ipa/Payload/Runner.app || true
          echo "Binary type confirmed!"
          rm -rf /tmp/verify-ipa

      # Step D: Generate SHA-256 Checksums
      - name: Generate Checksums
        run: |
          cd dist_output
          shasum -a 256 *.ipa > SHA256SUMS.txt
          cat SHA256SUMS.txt
          echo "### SHA-256 Checksums" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat SHA256SUMS.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # Step E: Upload Release IPA Artifacts
      - name: Upload iOS Release IPA Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: go-on-ios-release-ipa
          path: dist_output/*
          retention-days: 14

      # Step F: Publish GitHub Release
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v2.2.2-ios
          name: "go-On iOS v2.2.2 (Clean Rebuild & Sideloadly-Ready)"
          draft: false
          prerelease: false
          body: |
            ## go-On iOS v2.2.2 — Clean Rebuild
            
            This is a clean, verified release build of go-On for iOS (version 2.2.2, build 22).
            
            ### Included Files
            - `go-on-latest.ipa` — Clean packaged iOS release IPA ready for Sideloadly / Apple ID personal signing
            - `go-on-v2.2.2.ipa` — Versioned iOS release IPA archive
            - `SHA256SUMS.txt` — SHA-256 cryptographic checksums for authenticity verification
            
            ### Target Compatibility
            - Broad iOS compatibility: iOS 15.0 through iOS 18.x
            - Arm64 64-bit architecture
            
            ### Installation Instructions (via Sideloadly)
            1. Download `go-on-latest.ipa` to your computer.
            2. Connect your iPhone via USB and unlock it (tap "Trust This Computer" if prompted).
            3. Open [Sideloadly](https://sideloadly.io/).
            4. Drag `go-on-latest.ipa` into Sideloadly.
            5. Enter your Apple ID email in the Apple ID field.
            6. Click **Start**. Sideloadly signs the application and installs it directly onto your device.
            7. On your iPhone:
               - Open **Settings** -> **General** -> **VPN & Device Management**.
               - Under **Developer App**, select your Apple ID and tap **Trust**.
               - If on iOS 16+, go to **Settings** -> **Privacy & Security** -> **Developer Mode** and turn it **ON** (restart required).
          files: |
            dist_output/go-on-latest.ipa
            dist_output/go-on-v2.2.2.ipa
            dist_output/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
