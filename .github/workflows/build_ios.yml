name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    name: Build iOS Runner IPA
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Default Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          sudo xcodebuild -runFirstLaunch
          xcodebuild -version
          xcodebuild -showsdks
          xcrun simctl list runtimes

      - name: Set up Java (for tools)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      - name: Prepare Flutter and Dependencies
        working-directory: mobile
        run: |
          flutter config --no-enable-swift-package-manager
          flutter precache --ios
          flutter pub get
          cd ios
          pod install
          cd ..
          xcodebuild -showdestinations -scheme Runner -project ios/Runner.xcodeproj

      - name: Build iOS (No Codesign)
        working-directory: mobile
        run: |
          flutter build ios --release --no-codesign -v

      - name: Package Unsigned IPA
        working-directory: mobile
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r go-on-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-on-ios-ipa
          path: mobile/go-on-unsigned.ipa
          retention-days: 7
