<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Go-On Attendance Portal">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Go-On">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=goon4">

  <!-- Favicon & Browser Tab Icons -->
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=goon4">
  <link rel="shortcut icon" href="favicon.ico?v=goon4">
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png?v=goon4">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png?v=goon4">

  <title>Go-On Attendance System</title>
  <link rel="manifest" href="manifest.json?v=goon4">

  <script>
    (function() {
      try {
        var mode = localStorage.getItem('flutter.pref_theme_mode');
        if (mode === '"dark"' || mode === 'dark') {
          var style = document.createElement('style');
          style.id = 'theme-preload-style';
          style.innerHTML = 'html, body, #splash-loading { background-color: #0D0C13 !important; } .splash-title { color: #F7F5EE !important; } .splash-subtitle { color: #C5BDD3 !important; } .splash-spinner { border-color: rgba(197, 189, 211, 0.22) !important; border-top-color: #E4DFEB !important; }';
          document.head.appendChild(style);
        }
      } catch (e) {}
    })();
  </script>

  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #F8F6F2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }
    #splash-loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background-color: #F8F6F2;
      z-index: 99999;
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }
    .splash-logo {
      width: 80px;
      height: 80px;
      margin-bottom: 20px;
      animation: pulse 2.2s infinite ease-in-out;
    }
    .splash-title {
      font-size: 24px;
      font-weight: 700;
      color: #2D2522;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }
    .splash-subtitle {
      font-size: 13px;
      font-weight: 500;
      color: #8C827A;
      margin-bottom: 24px;
    }
    .splash-spinner {
      width: 38px;
      height: 38px;
      border: 3.5px solid rgba(197, 160, 89, 0.22);
      border-top: 3.5px solid #9E7D3B;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.95; }
      50% { transform: scale(1.04); opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="splash-loading">
    <img src="icons/Icon-192.png?v=goon4" class="splash-logo" alt="Go-On" onerror="this.style.display='none'">
    <div class="splash-title">Go-On</div>
    <div class="splash-subtitle">Loading Attendance Portal...</div>
    <div class="splash-spinner"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function() {
      var splash = document.getElementById('splash-loading');
      if (splash) {
        splash.style.opacity = '0';
        splash.style.visibility = 'hidden';
        setTimeout(function() { splash.remove(); }, 400);
      }
    });
  </script>
  <script src="flutter_bootstrap.js?v=2.0.4" async></script>
</body>
</html>
