name: attendance_marker_mobile
description: "Go-On mobile application for Students and Faculty"
publish_to: "none"
version: 2.1.0+10

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  provider: ^6.1.1
  image_picker: ^1.0.7
  flutter_local_notifications: ^22.3.1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/fonts/
    - assets/avatars/
    - assets/animations/
  fonts:
    - family: BrockScript
      fonts:
        - asset: assets/fonts/BrockScript.ttf
    - family: CaviarDreams
      fonts:
        - asset: assets/fonts/CaviarDreams.ttf
        - asset: assets/fonts/CaviarDreams_Bold.ttf
          weight: 700
        - asset: assets/fonts/CaviarDreams_Italic.ttf
          style: italic
        - asset: assets/fonts/CaviarDreams_BoldItalic.ttf
          weight: 700
          style: italic

